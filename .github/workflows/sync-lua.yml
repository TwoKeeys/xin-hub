name: Sync encoded Lua
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [source_lua_updated]

permissions:
  contents: write

concurrency:
  group: sync-encoded-lua
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and encode source
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: python3 scripts/sync_obfuscation.py
      - name: Publish game script before changing loader
        run: |
          if ! git diff --quiet -- storage-hunters.lua || [ ! -f storage-hunters.lua ] || ! git ls-files --error-unmatch storage-hunters.lua >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add storage-hunters.lua
            if ! git diff --cached --quiet; then
              git commit -m "Sync encoded Storage Hunters script"
              git push
            fi
          fi
      - name: Publish stable multi-game loader
        run: |
          if git diff --quiet -- main.lua; then
            echo "Hub loader unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.lua
          git commit -m "Sync multi-game Xin Hub loader"
          git push
